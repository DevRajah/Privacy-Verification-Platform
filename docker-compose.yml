version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: privacy_verification_postgres
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: privacy_verification_db
    volumes:
      - privacy_verification_data:/var/lib/postgresql/data

volumes:
  privacy_verification_data: